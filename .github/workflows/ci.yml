# The gates from docs/REVIEW.md, run on every push to main and every PR.
# Everything here is a command the repo already has locally — CI adds no new
# tooling, it just refuses to let a red gate land on main.
name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ts:
        name: TS workspaces (packages + web)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # packages/render depends on node-canvas; the linux-x64 prebuild
            # normally lands without system cairo, so no apt step is needed.
            - run: npm ci

            - name: Prettier (format:check)
              run: npm run format:check

            # Build first, on purpose: apps/web resolves @justpaint/document
            # and @justpaint/editor through their built dist/, so a fresh clone
            # cannot typecheck until the packages are built (docs/NOTES.md).
            - name: Build (packages + SPA)
              run: npm run build

            - name: Typecheck (tsc + vue-tsc)
              run: npm run types

            - name: Unit tests (Vitest)
              run: npm run test

            # lint:all rewrites files (--fix / --write); lint:ci is the same
            # linters in check mode (prettier is covered by format:check above).
            - name: Lint (stylelint + eslint + contrast, check mode)
              run: npm run lint:ci -w @justpaint/web

            # The worker is bundled by the build step above; this proves the
            # bundle actually renders a PNG under node-canvas.
            - name: Render worker selftest
              run: npm run selftest -w @justpaint/render

    # The deployable artifact, built and actually run. A Dockerfile that only
    # builds proves nothing: this boots the image against a real Postgres and
    # checks that it serves both halves of the same origin — the API's readiness
    # probe and the SPA shell.
    image:
        name: Docker image (build + smoke)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: justpaint
                    POSTGRES_PASSWORD: justpaint
                    POSTGRES_DB: justpaint
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U justpaint -d justpaint"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            DATABASE_URL: postgres://justpaint:justpaint@localhost:5432/justpaint?sslmode=disable

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-go@v6
              with:
                  go-version: '1.26'
                  cache-dependency-path: server/go.sum

            - name: Build the image
              run: docker build -t justpaint:ci .

            - name: Apply migrations (goose)
              run: |
                  go install github.com/pressly/goose/v3/cmd/goose@latest
                  goose -dir server/migrations postgres "$DATABASE_URL" up

            - name: Boot the image
              run: |
                  docker run -d --name justpaint --network host \
                      -e ENV=prod \
                      -e JWT_SECRET=ci-only-secret-not-used-anywhere-else-0123456789 \
                      -e DATABASE_URL="$DATABASE_URL" \
                      justpaint:ci

            - name: Smoke test (readiness + the SPA shell)
              run: |
                  for i in $(seq 1 30); do
                      if curl -sf http://localhost:8080/readyz > /dev/null; then break; fi
                      sleep 2
                  done
                  echo "--- /readyz ---"
                  curl -sS --fail-with-body http://localhost:8080/readyz
                  echo
                  echo "--- / (SPA shell) ---"
                  curl -sS --fail-with-body http://localhost:8080/ | head -c 200
                  echo
                  curl -sS http://localhost:8080/ | grep -qi "<!doctype html" \
                      || { echo "the root did not serve the SPA shell"; exit 1; }
                  # A client-side route must fall back to the shell, not 404.
                  curl -sS --fail-with-body http://localhost:8080/leaderboard | grep -qi "<!doctype html" \
                      || { echo "a client route did not fall back to the shell"; exit 1; }

            - name: Container logs
              if: always()
              run: docker logs justpaint

    go:
        name: Go service
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: justpaint
                    POSTGRES_PASSWORD: justpaint
                    POSTGRES_DB: justpaint
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U justpaint -d justpaint"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            # The DB-backed tests skip themselves without this; with it they run.
            DATABASE_URL: postgres://justpaint:justpaint@localhost:5432/justpaint?sslmode=disable
            # Config rejects secrets shorter than 32 bytes outside dev. CI-only value.
            JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

        defaults:
            run:
                working-directory: server

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-go@v6
              with:
                  go-version: '1.26'
                  cache-dependency-path: server/go.sum

            - name: gofmt
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "gofmt needed on:"; echo "$unformatted"; exit 1
                  fi

            - name: go vet
              run: go vet ./...

            - name: go build
              run: go build ./...

            - name: Apply migrations (goose)
              run: |
                  go install github.com/pressly/goose/v3/cmd/goose@latest
                  goose -dir migrations postgres "$DATABASE_URL" up

            # -race here and nowhere else: the server is concurrency-heavy (the WS
            # hub, the sweeper, three limiters) and Windows dev boxes have no C
            # compiler, so this Linux runner is the only place it can run at all.
            - name: go test (race detector)
              run: go test -race ./...
